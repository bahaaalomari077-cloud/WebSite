          - heading "What is Reverse Factoring?" [level=2] [ref=f1e113]
          - paragraph [ref=f1e114]: Payables Finance — or Reverse Factoring — allows buyers to offer an early-payment option to their suppliers based on approved invoices. Suppliers sell/reassign the invoices to the bank in exchange for a discounted early payment. Buyers then pay the full invoice value to the bank on the maturity date — typically under an Irrevocable Payment Undertaking.
