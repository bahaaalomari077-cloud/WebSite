<div class="topbar">
  <div class="wrap">
    <div class="tb-left">@if (cms.settings().socialLinks[0]; as social) { <a [href]="social.url" target="_blank" rel="noopener">{{ cms.label(social) }}</a> } @else { <a [href]="cms.settings().linkedInUrl">{{ 'topbar.linkedin' | translate }}</a> }</div>
    <div class="tb-right">
      <a [href]="'mailto:' + cms.settings().contactEmail" dir="ltr">&#9993; {{ cms.settings().contactEmail }}</a>
      <span class="auth-links">
        <a [href]="cms.settings().loginUrl">{{ 'topbar.login' | translate }}</a>
        <span>/</span>
        <a [href]="cms.settings().signupUrl">{{ 'topbar.signup' | translate }}</a>
      </span>
      <div class="langtog">
        <button (click)="lang.setLang('en')" [class.active]="lang.currentLang() === 'en'">EN</button>
        <button (click)="lang.setLang('ar')" [class.active]="lang.currentLang() === 'ar'">ع</button>
      </div>
    </div>
  </div>
</div>
