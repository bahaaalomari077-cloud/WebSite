<div class="pagehead">
  <div class="wrap">
    <div class="crumb">{{ lang.t('articles.crumb') }} › {{ lang.t('articles.pageTitle') }}</div>
    <div class="pagehead-row">
      <h1>{{ lang.t('articles.pageTitle') }}</h1>
    </div>
  </div>
</div>

<section class="section section-soft">
  <div class="wrap">
    <div class="center" style="margin-bottom:40px">
      <div class="eyebrow">{{ lang.t('articles.eyebrow') }}</div>
      <h2>{{ lang.t('articles.listTitle') }}</h2>
    </div>
    <div class="article-grid">
      @for (post of posts(); track post.id) {
        <a class="article-card" [routerLink]="['/article', post.id]">
          <img [src]="imageSrc(post)" [alt]="getTitle(post)">
          <div class="article-body">
            <div class="date">{{ getDate(post) }}</div>
            <h3>{{ getTitle(post) }}</h3>
            <div class="more">{{ lang.t('articles.readMore') }}</div>
          </div>
        </a>
      }
    </div>
  </div>
</section>
